services:
  - type: web
    name: downnepa
    runtime: python
    plan: starter
    buildCommand: >-
      python -m pip download --no-deps --only-binary=:all:
      --dest /tmp/downnepa-uv uv==0.11.33 &&
      echo "9542178978b0b6f16a7ae99e55aca039f493a1edb373a15d7993eab80a28615a  /tmp/downnepa-uv/uv-0.11.33-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
      | sha256sum --check --strict &&
      python -m pip install --no-deps
      /tmp/downnepa-uv/uv-0.11.33-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl &&
      uv sync --frozen --no-dev &&
      npm --prefix frontend ci &&
      npm --prefix frontend run build
    startCommand: >-
      export PATH="$HOME/.local/bin:$PATH" &&
      uv run --frozen --no-dev uvicorn backend.app.main:app
      --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: downnepa-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DOWNNEPA_DB_PATH
        value: /opt/render/project/src/data/downnepa.db
      - key: DOWNNEPA_SESSION_DAYS
        value: "14"
      - key: DOWNNEPA_ADMIN_EMAIL
        sync: false
      - key: DOWNNEPA_ADMIN_PASSWORD
        sync: false
      - key: DOWNNEPA_WEB_ORIGINS
        sync: false
